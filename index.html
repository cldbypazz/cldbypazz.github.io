<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bypazz</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/icon/bypazzicon.png" />
    <script src="https://download.playfab.com/PlayFabSDK.js"></script>
    <style>
      html, body {
        margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; overflow-y: auto;
        font-family: 'Roboto Mono', monospace;
        background: linear-gradient(0deg, #1a1a1a, #000);
        animation: backgroundFade 5s infinite alternate ease-in-out; 
      }
      @keyframes backgroundFade {
        0%, 15% { background: #1a1a1a; }
        90%, 100% { background: #000; }
      }

      /* USERNAME UI */
      #userContainer {
        position: fixed; top: 15px; left: 15px; z-index: 1000;
        color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center;
      }
      #usernameDisplay { padding: 5px 12px; transition: all 0.3s; border: 2px solid transparent; }
      .edit-active {
        border: 2px solid white !important; border-radius: 10px; 
        background: rgba(255,255,255,0.1); outline: none; cursor: text;
      }

      /* BAN OVERLAY - FULL SCREEN BLOCKER */
      #banOverlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #ff0000; color: white; display: none;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 1000000; text-align: center;
      }
      #banOverlay h1 { font-size: 72px; margin: 0; font-weight: 900; }
      #banOverlay p { font-size: 24px; margin: 20px 0; }
      #banOverlay .timer { font-size: 32px; font-weight: bold; background: black; padding: 15px 30px; border-radius: 5px; }

      .splash {
        position: fixed; top:0; left:0; width:100vw; height:100vh;
        background-color: rgba(0,0,0,0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 999; cursor: pointer; transition: all 1s ease;
      }
      .splash.fade { transform: scale(1.5); opacity: 0; }
      .splash h1 { font-size: 64px; font-weight: bold; margin:0; }
      .splash p { font-size: 24px; margin-top: 20px; opacity: 0; transition: opacity 1s ease; }
      .splash.showHint p { opacity: 1; }
      
      .simple-update {
        position: absolute; top: 15px; left: 0; width: 100%;
        text-align: center; color: white; font-size: 16px; z-index: 998; pointer-events: none;
      }

      .game-button {
        background-color: black; color: white; border: 1px solid red;
        font-size: 26px; width: 100%; cursor: pointer; border-radius: 10px;
        margin: 10px 0; max-width: 600px; display: block;
      }
      center { margin-top: 100px; margin-bottom: 80px; }
      
      #globalBanner {
        position: fixed; top: 0; left: 0; width: 100%;
        background-color: #ff0000; color: white; text-align: center;
        padding: 15px; font-weight: bold; font-size: 20px; z-index: 99999;
        display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      }
      
      #adminToggleBtn {
        position: fixed; bottom: 15px; right: 15px; padding: 10px 20px;
        background-color: #000; color: #fff; border: 1px solid red;
        border-radius: 8px; cursor: pointer; z-index: 9999;
      }
      #adminOverlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: rgba(0,0,0,0.9); z-index: 99999;
        display: none; justify-content: center; align-items: center;
      }
      .admin-modal {
        background-color: #111; border: 1px solid red; border-radius: 12px;
        padding: 30px; width: 90%; max-width: 400px; text-align: center; color: white;
      }
      .admin-modal input {
        width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
        border: none; box-sizing: border-box; font-family: 'Roboto Mono', monospace;
      }
      .admin-modal button {
        width: 100%; padding: 12px; cursor: pointer; background-color: red;
        color: white; border: none; border-radius: 6px; font-weight: bold;
        margin-bottom: 10px; font-family: 'Roboto Mono', monospace; font-size: 16px;
      }
      
      #liveTracker {
        position: fixed; bottom: 15px; left: 15px;
        color: #ff0000; font-size: 14px; z-index: 998; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="banOverlay">
        <h1>YOU ARE BANNED!</h1>
        <p id="banReasonText">Reason: Unknown</p>
        <div class="timer" id="banCountdown">Calculating...</div>
    </div>

    <div id="userContainer">
        <span id="usernameDisplay" contenteditable="false" spellcheck="false">Loading...</span>
    </div>

    <div id="globalBanner"></div>

    <div class="splash" id="splashScreen">
      <h1>Bypazz</h1>
      <p id="splashHint">Click Your Screen To Continue</p>
    </div>
    
    <div class="simple-update" id="updateLogger"> 
      <strong>•</strong> <strong>Update v76: TEST UPDATE! ALL GAMES WILL BE ADDED BACK SHORTLY!</strong> <strong>•</strong> 
    </div>
    
    <div id="liveTracker">
       Live Users: <span id="userCount">0</span> (not working)
    </div>

    <center>
      <button id="vex6Button" class="game-button">Vex 6</button>
      <button id="slowRoadsButton" class="game-button">Slow.Roads</button>
      <button id="clusterTrucksButton" class="game-button">Cluster Trucks</button>
    </center>
    
    <button id="adminToggleBtn">Admin Tools</button>

    <div id="adminOverlay">
      <div class="admin-modal">
        <h2>Ban User</h2>
        <input type="text" id="targetIdInput" placeholder="PlayFab ID..." />
        <input type="text" id="banReasonInput" placeholder="Reason..." />
        <input type="number" id="banHoursInput" placeholder="Hours (Leave blank for perm)" />
        <button id="executeBanBtn">Apply Ban</button>
        <button onclick="document.getElementById('adminOverlay').style.display='none'" style="background:transparent; border:1px solid #555;">Close</button>
      </div>
    </div>

    <script>
        // --- PLAYFAB SETTINGS ---
        PlayFab.settings.titleId = "1BA2E1"; 
        let isUserBanned = false;

        // --- AUTH & ACCOUNT PERSISTENCE ---
        function getCustomId() {
            let id = localStorage.getItem("bypazz_auth_id");
            if (!id) {
                id = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("bypazz_auth_id", id);
            }
            return id;
        }

        function login() {
            const request = {
                TitleId: PlayFab.settings.titleId,
                CustomId: getCustomId(),
                CreateAccount: true,
                InfoRequestParameters: { GetPlayerProfile: true, GetUserBans: true }
            };

            PlayFabClientSDK.LoginWithCustomID(request, (result, error) => {
                if (result) {
                    processLogin(result.data);
                } else if (error && error.error === "AccountBanned") {
                    location.reload(); 
                }
            });
        }

        function processLogin(data) {
            const profile = data.InfoResultPayload.PlayerProfile;
            const bans = data.InfoResultPayload.UserBans;

            // Username Logic
            let name = profile?.DisplayName || "User" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('usernameDisplay').innerText = name.substring(0,8);
            saveUsername(name); // Auto-save even if not changed

            // Ban Check
            const activeBan = bans.find(b => b.Active);
            if (activeBan) {
                isUserBanned = true;
                triggerBanUI(activeBan);
            }
        }

        // --- USERNAME SYNC ---
        const nameDisplay = document.getElementById('usernameDisplay');
        nameDisplay.onclick = () => {
            nameDisplay.contentEditable = true;
            nameDisplay.classList.add('edit-active');
            nameDisplay.focus();
        };

        nameDisplay.onkeydown = (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                nameDisplay.blur();
            }
        };

        nameDisplay.onblur = () => {
            nameDisplay.contentEditable = false;
            nameDisplay.classList.remove('edit-active');
            let newName = nameDisplay.innerText.trim();
            if (newName.length > 8) newName = newName.substring(0, 8);
            nameDisplay.innerText = newName;
            saveUsername(newName);
        };

        function saveUsername(name) {
            PlayFabClientSDK.UpdateUserTitleDisplayName({ DisplayName: name }, (res, err) => {
                if (res) console.log("Sync: " + name);
            });
        }

        // --- BAN MONITORING ---
        function triggerBanUI(ban) {
            document.getElementById('banOverlay').style.display = 'flex';
            document.getElementById('banReasonText').innerText = "Reason: " + (ban.Reason || "Violating Terms");
            
            const expiry = ban.Expires ? new Date(ban.Expires) : null;
            
            function updateBanTimer() {
                if (!expiry) {
                    document.getElementById('banCountdown').innerText = "PERMANENT";
                    return;
                }
                const now = new Date();
                const diff = expiry - now;
                if (diff <= 0) location.reload();

                const y = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
                const mo = Math.floor((diff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30));
                const d = Math.floor((diff % (1000 * 60 * 60 * 24 * 30)) / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('banCountdown').innerText = `${y}y ${mo}m ${d}d ${h}h ${m}m ${s}s`;
            }
            setInterval(updateBanTimer, 1000);
            updateBanTimer();
        }

        // Check every 1 minute
        setInterval(() => {
            PlayFabClientSDK.GetPlayerCombinedInfo({
                InfoRequestParameters: { GetUserBans: true }
            }, (res) => {
                if (res) {
                    const activeBan = res.data.InfoResultPayload.UserBans.find(b => b.Active);
                    if ((activeBan && !isUserBanned) || (!activeBan && isUserBanned)) location.reload();
                }
            });
        }, 60000);

        // --- GAME BUTTONS & SPLASH ---
        const splash = document.getElementById('splashScreen');
        setTimeout(() => splash.classList.add('showHint'), 1000);
        splash.addEventListener('click', () => {
          splash.classList.add('fade');
          setTimeout(() => splash.style.display = 'none', 1000);
        });

        const urls = {
          vex6: "https://script.google.com/macros/s/AKfycbzi5I00V5E4UoWKNwYMpazWyXDs1J4m0hui0937lFzMRKs31QGZ3rcUHRroAt13wmc9tw/exec",
          slowRoads: "https://script.google.com/macros/s/AKfycbzqDA2SnuVZ3DRelxxbUxSV9Z1RJz_gQfDRx06WUpgppWgrdDEErtZ1Lev9O6j2w9ioBQ/exec",
          clusterTrucks: "https://script.google.com/macros/s/AKfycbw6e8fflbfydV7kom5id09nKaM6ix0hLlXHbs3XHOnxzrndUgPtHUHENrwKomI2Hpk3/exec",
        };

        function openGameInNewTab(url) {
          const win = window.open("about:blank", "_blank");
          if (!win) return alert("Popup blocked!");
          win.document.body.style.margin = '0';
          const iframe = win.document.createElement('iframe');
          iframe.src = url; iframe.style.border = 'none'; iframe.style.width = '100vw'; iframe.style.height = '100vh';
          win.document.body.appendChild(iframe);
        }

        document.getElementById('vex6Button').onclick = () => openGameInNewTab(urls.vex6);
        document.getElementById('slowRoadsButton').onclick = () => openGameInNewTab(urls.slowRoads);
        document.getElementById('clusterTrucksButton').onclick = () => openGameInNewTab(urls.clusterTrucks);

        // --- GLOBAL MESSAGES (PASTEBIN) ---
        const pastebinRawUrl = 'https://pastebin.com/raw/Jtgt3dS0'; 
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(pastebinRawUrl)}`;
        let lastMessage = "";

        async function checkForGlobalMessage() {
            try {
                const response = await fetch(proxyUrl, { cache: "no-store" });
                const trimmedText = (await response.text()).trim();
                if (trimmedText !== lastMessage && trimmedText !== "") {
                    lastMessage = trimmedText;
                    const banner = document.getElementById('globalBanner');
                    banner.innerText = trimmedText; banner.style.display = 'block';
                    setTimeout(() => { banner.style.display = 'none'; }, 10000);
                }
            } catch (e) {}
        }
        setInterval(checkForGlobalMessage, 15000);
        checkForGlobalMessage();

        // --- ADMIN BUTTON LOGIC ---
        document.getElementById('adminToggleBtn').onclick = () => {
            document.getElementById('adminOverlay').style.display = 'flex';
        };

        document.getElementById('executeBanBtn').onclick = () => {
            const tid = document.getElementById('targetIdInput').value;
            const reas = document.getElementById('banReasonInput').value;
            const hrs = document.getElementById('banHoursInput').value;

            PlayFabClientSDK.ExecuteCloudScript({
                FunctionName: "AdminBanUser",
                FunctionParameter: { targetId: tid, reason: reas, duration: hrs || null }
            }, (res, err) => {
                if (res && !res.data.Error) alert("User Banned!");
                else alert("Failed. Ensure you have the 'admin' tag.");
            });
        };

        login();
    </script>
    
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
      import { getDatabase, ref, onValue, push, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";
      const firebaseConfig = {
        apiKey: "AIzaSyAk-UfKf45Y9p01Vfkr574_Y45acEbIJzg",
        authDomain: "bypazz-online-users.firebaseapp.com",
        databaseURL: "https://bypazz-online-users-default-rtdb.firebaseio.com",
        projectId: "bypazz-online-users",
        storageBucket: "bypazz-online-users.firebasestorage.app",
        messagingSenderId: "154741065924",
        appId: "1:154741065924:web:49ddd5b319b1a10045e191"
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const connectionsRef = ref(db, 'connections');
      const connectedRef = ref(db, '.info/connected');
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          const con = push(connectionsRef);
          onDisconnect(con).remove();
          set(con, true);
        }
      });
      onValue(connectionsRef, (snap) => {
        document.getElementById('userCount').innerText = snap.numChildren();
      });
    </script>
  </body>
</html>
